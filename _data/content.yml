### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "my <b>Talent</b>"
  bg_title: "Skills"

  column1:
    items:

    - label: "Python" #0-10 progress in dots
      text: "기본 함수 및 자료구조를 이해하고 있음. flask를 활용한 웹 서버 구동 가능"
      value: "50" #0-100 progress in %

    - label: "PowerPoint" #0-10 progress in dots
      text: "DIAT 자격증 보유. 표 또는 그래프를 활용한 발표자료 만들기 가능"
      value: "65" #0-100 progress in %

      

  column2:
    items:
      - label: "JavaScript" #0-10 progress in dots
        text: "기본 구조 이해 및 간단한 웹 페이지를 만들 수 있음"
        value: "25" #0-100 progress in %

      - label: "WordPress" #0-10 progress in dots
        text: "DIAT 자격증 보유. 머리글 및 바닥글, 표 또는 그래프를 활용한 보고서 작성 가능"
        value: "70" #0-100 progress in %

  column3:
    items:
      - label: "html" #0-10 progress in dots
        text: "기본 구조 이해 및 오픈 차트 그래프 구현 가능"
        value: "40" #0-100 progress in %

      - label: "Linux" #0-10 progress in dots
        text: "리눅스 마스터 2급 자격증 보유. iptables를 통한 방화벽 구축 가능"
        value: "60" #0-100 progress in %

