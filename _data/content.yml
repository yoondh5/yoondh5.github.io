### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "my <b>Talent</b>"
  bg_title: "Skills"

  column1:
    items:

    - label: "Python" #0-10 progress in dots
      text: "기본 함수 및 자료구조를 이해하고 있으며, 다양한 데이터 처리 작업에 Python을 활용할 수 있습니다. flask를 이용해 간단한 웹 서버를 직접 구축해본 경험이 있습니다. 또한, 파일 입출력, 예외 처리, 리스트 컴프리헨션 등 실무에 필요한 다양한 기능을 활용할 수 있습니다"
      value: "50" #0-100 progress in %

    - label: "PowerPoint" #0-10 progress in dots
      text: "DIAT 자격증을 보유하고 있으며, 표 또는 그래프를 활용한 발표자료 제작이 가능합니다. 청중의 이해를 돕는 시각적 요소와 애니메이션 효과를 효과적으로 적용할 수 있습니다. 다양한 템플릿을 활용해 목적에 맞는 프레젠테이션을 구성한 경험이 있습니다."
      value: "65" #0-100 progress in %

      

  column2:
    items:
      - label: "JavaScript" #0-10 progress in dots
        text: "JavaScript의 기본 구조를 이해하고 있으며, DOM 조작 및 이벤트 처리 등 웹 페이지의 동적 기능을 구현할 수 있습니다. 간단한 웹 페이지를 직접 만들어본 경험이 있습니다. 또한, 외부 라이브러리나 플러그인을 활용해 기능을 확장할 수 있습니다."
        value: "25" #0-100 progress in %

      - label: "WordPress" #0-10 progress in dots
        text: "DIAT 자격증을 보유하고 있으며, 워드프레스를 활용한 블로그 및 웹사이트 구축 경험이 있습니다. 머리글 및 바닥글, 표 또는 그래프 등을 활용하여 다양한 형태의 보고서를 작성할 수 있습니다. 플러그인 설치 및 테마 커스터마이징을 통해 사이트의 기능과 디자인을 개선할 수 있습니다."
        value: "70" #0-100 progress in %

  column3:
    items:
      - label: "html" #0-10 progress in dots
        text: "HTML의 기본 구조를 이해하고 있으며, 시맨틱 태그를 활용해 웹 페이지의 가독성과 접근성을 높일 수 있습니다. 오픈 차트 그래프 등 시각화 요소를 직접 구현해본 경험이 있습니다. CSS와 연동하여 다양한 스타일링 작업도 수행할 수 있습니다."
        value: "40" #0-100 progress in %

      - label: "Linux" #0-10 progress in dots
        text: "리눅스 마스터 2급 자격증을 보유하고 있으며, 다양한 리눅스 배포판에서 시스템 관리 경험이 있습니다. iptables를 이용한 방화벽 구축 및 네트워크 보안 설정이 가능합니다. 쉘 스크립트를 활용한 자동화 작업도 수행할 수 있습니다."
        value: "60" #0-100 progress in %

### Resume [ resume ]
resume:
  title: "Resume"
  subtitle: "my <b>Story</b>"
  bg_title: "History"

  education:
    title: "Education"
    items:
      - name: "한국폴리텍대학 강서캠퍼스 사이버보안과"
        subname: "보안 엔지니어 교육"
        period: "<b>2023 - 2026(졸업예정)</b>"
        text: "보안 엔지니어 C, JAVA, PYTHON 기본 교육 실시"
  experience:
    title: "Goals"
    items:
      - name: "네트워크 보안 인재"
        subname: "기본기 및 경험 축적"
        period: "<b>1~2년차</b>"
        text: "네트워크/시스템 보안 운영 및 실무 프로젝트에 주도적으로 참여하며 네트워크 기본기 및 장비를 운용하는 법을 배우고 네트워크 트래픽 분석 및 장애 대응 경험을 축적"

      - name: "위협 탐지 전문가"
        subname: "전문가로 발전"
        period: "<b>3~4년차</b>"
        text: "네트워크 보안 설계 및 보고서 작성, 보안성 검토 경험하고 보안 시스템 로그 분석, 위협 탐지 및 대응 역량을 강화"

      - name: "네트워크 보안 전문가"
        subname: "신규 보안 위협 분석"
        period: "<b>5년차 이상</b>"
        text: "신규 보안 위협 분석 및 최신 기술을 학습 및 적용하며 대외 발표 및 커뮤니케이션 역량을 강화"

